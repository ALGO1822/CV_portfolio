    <!-- Role with blinking caret -->
    <g transform="translate(0, 224)">
      <text x="0" y="0" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Inter, sans-serif" font-size="28" font-weight="500" letter-spacing="-0.5">Flutter Developer</text>
      <rect x="224" y="-22" width="13" height="27" fill="#f5f5f7"/>
    </g>

    <!-- Lede -->
    <g transform="translate(0, 276)" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Inter, sans-serif" font-size="19" font-weight="400">
      <text x="0" y="0">I build mobile apps with Flutter, Supabase and Firebase,</text>
      <text x="0" y="28">from clean architecture to the last animation.</text>
    </g>

    <!-- CTA Buttons -->
