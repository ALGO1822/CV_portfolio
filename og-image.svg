    <text x="1024" y="22" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">◐</text>
  </g>

  <!-- Hero Content (exact site text & styles) -->
  <g transform="translate(80, 130)">
